<!DOCTYPE html>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 90px)}

button,select,input{font:inherit;color:var(--tx)}

.btn.s{background:none;color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:none;color:var(--rd);border:1px solid var(--bd)}
.ib{background:none;border:0;font-size:24px;font-weight:200;color:var(--mu);padding:4px 10px;margin:0 -10px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:20px 0 2px}
input,select{width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;font-size:17px;-webkit-appearance:none;appearance:none;outline:0}
input:focus,select:focus{border-bottom-color:var(--tx)}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);align-items:center}
.row:last-child{border:0}
.row .l{min-width:0}.row .r{white-space:nowrap;text-align:right}
.tap{cursor:pointer}
.bar{height:3px;background:var(--bd);margin-top:6px}
.bar i{display:block;height:100%;background:var(--tx)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:16px 0;color:var(--mu);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.tabs button.on{color:var(--tx)}

#toast.on{opacity:1}
.tel{color:var(--tx);text-decoration:underline;text-underline-offset:3px}
.hid{display:none}
</style></head><body>
<div id="v-mov"></div><div id="v-rie" class="hid"></div><div id="v-cre" class="hid"></div><div id="v-for" class="hid"></div><div id="v-dati" class="hid"></div>
<div id="toast"></div>
<div class="tabs"><button data-t="mov" class="on">Movimenti</button><button data-t="rie">Riepilogo</button><button data-t="cre">Crediti</button><button data-t="for">Fornitori</button><button data-t="dati">Dati</button></div>
<script>
var MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
var TRIM=['1º trim. (gen–mar)','2º trim. (apr–giu)','3º trim. (lug–set)','4º trim. (ott–dic)'];
var KEY='marocco_v1',db={m:[],cr:[],f:[],s:{ap:10403}};
function norm(x){if(x&&Array.isArray(x.m)&&Array.isArray(x.cr)&&x.s){x.f=Array.isArray(x.f)?x.f:[];return x}return null}
try{var raw=localStorage.getItem(KEY);if(raw){var y0=norm(JSON.parse(raw));if(y0)db=y0}}catch(e){}
var $=function(s){return document.querySelector(s)};
var ui={tab:'mov',form:false,ed:null,cform:false,ced:null,fform:false,fed:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Salvataggio non riuscito: fai un backup')}}
function toast(t){var e=$('#toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},2600)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nf(n,d){return n.toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d})}
function pad(n){return String(n).padStart(2,'0')}
function amt(n){return nf(Math.abs(n),Number.isInteger(Math.round(n*100)/100)?0:2)}
function dh(n){return (n<0?'−':'')+amt(n)+' DH'}
function num(s){var v=String(s).trim().replace(',','.');return v===''?'':parseFloat(v)}
function dm(s){return s.slice(8)+'/'+s.slice(5,7)}
function dmy(s){return dm(s)+'/'+s.slice(0,4)}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var cur=today().slice(0,7);
function shift(k,n){var y=+k.slice(0,4),m=+k.slice(5)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1)}
function nav(){return '<div class="nav"><button class="ib" data-m="-1">‹</button><b>'+MESI[+cur.slice(5)-1]+' '+cur.slice(0,4)+'</b><button class="ib" data-m="1">›</button></div>'}
function sum(a,t){return a.filter(function(x){return x.t===t}).reduce(function(s,x){return s+x.am},0)}
function monthOf(k){return db.m.filter(function(x){return x.d.indexOf(k)===0}).sort(function(a,b){return b.d.localeCompare(a.d)||b.id-a.id})}
function saldo(upTo){var s=db.s.ap;db.m.forEach(function(x){if(!upTo||x.d<=upTo)s+=x.t==='r'?x.am:-x.am});return s}
var TIPI0=['Custode','Elettricità','Gasolio','Wifi','Acqua','Manutenzione'];
function supById(id){return db.f.filter(function(f){return f.id===id})[0]}
function supLabel(f){var nm=[f.n,f.c].filter(Boolean).join(' ');return f.tp+(nm?' · '+nm:'')}
function supName(x){var f=x.fo?supById(x.fo):null;return f?[f.n,f.c].filter(Boolean).join(' '):''}
function saldoBefore(st){var s=db.s.ap;db.m.forEach(function(x){if(x.d<st)s+=x.t==='r'?x.am:-x.am});return s}
function sg(n){return(n<0?'-':'')+amt(n)}
function listOf(f){var c={};db.m.forEach(function(x){var v=(x[f]||'').trim();if(v){var k=v.toLowerCase();c[k]=c[k]||{n:v,c:0};c[k].c++}});return Object.keys(c).map(function(k){return c[k]}).sort(function(a,b){return b.c-a.c}).map(function(o){return o.n})}
function byId(a,id){return a.filter(function(x){return x.id===id})[0]}

/* ---- MOVIMENTI ---- */
function supOpts(){var o='<option value="">Scegli fornitore…</option>';db.f.slice().sort(function(a,b){return supLabel(a).localeCompare(supLabel(b))}).forEach(function(f){o+='<option value="'+f.id+'">'+esc(supLabel(f))+'</option>'});return o+'<option value="x">Altro (scrivi nella nota)</option>'}
function formMov(){
 return '<div class="card"><h2>'+(ui.ed!=null?'Modifica movimento':'Nuovo movimento')+'</h2><label>Tipo</label><select id="ft"><option value="c">Costo (uscita)</option><option value="r">Ricavo (entrata)</option></select><div id="fow"><label>Fornitore</label><select id="ffo">'+supOpts()+'</select>'+(db.f.length?'':'<div class="mu" style="margin-top:8px">Nessun fornitore registrato: aggiungili dalla scheda Fornitori, oppure scegli Altro.</div>')+'</div><div id="dsw"><label>Descrizione (facoltativa se scrivi la nota)</label><input id="fs" list="dl-ds" autocomplete="off" placeholder="es. Gasolio"></div><label>Importo (DH)</label><input id="fa" inputmode="decimal" placeholder="0"><label>Data</label><input id="fd" type="date"><label>Categoria (facoltativa)</label><input id="fc" list="dl-ca" autocomplete="off" placeholder="es. Utenze"><label>kWh (facoltativo)</label><input id="fk" inputmode="decimal"><label>Litri (facoltativo)</label><input id="fl" inputmode="decimal"><label>Quantità (facoltativa)</label><input id="fq" inputmode="decimal"><label>Nota</label><input id="fn"><button class="btn" id="sm">Salva</button>'+(ui.ed!=null?'<button class="btn d" id="dm">Elimina</button>':'')+'<button class="btn s" id="cm">Annulla</button><datalist id="dl-ds">'+listOf('ds').map(function(v){return'<option value="'+esc(v)+'">'}).join('')+'</datalist><datalist id="dl-ca">'+listOf('ca').map(function(v){return'<option value="'+esc(v)+'">'}).join('')+'</datalist></div>'}
function syncMov(){var t=$('#ft').value,fo=$('#ffo').value;$('#fow').className=t==='c'?'':'hid';$('#dsw').className=(t==='r'||fo==='x')?'':'hid'}
function fillMov(){var x=ui.ed!=null?byId(db.m,ui.ed):null;x=x||{t:'c',d:ui.fd};
 var fo=x.t==='c'?(x.fo&&supById(x.fo)?String(x.fo):(ui.ed!=null?'x':'')):'x';
 $('#ft').value=x.t;$('#ffo').value=fo;$('#fs').value=(fo==='x')?(x.ds||''):'';$('#fa').value=x.am==null?'':x.am;$('#fd').value=x.d;$('#fc').value=x.ca||'';$('#fk').value=x.kw==null?'':x.kw;$('#fl').value=x.li==null?'':x.li;$('#fq').value=x.q==null?'':x.q;$('#fn').value=x.n||'';syncMov()}
function renderMov(){var k=cur,its=monthOf(k),c=sum(its,'c'),r=sum(its,'r'),sd=saldo(k+'-31'),h=nav();
 h+='<div class="card"><div class="mu">Saldo disponibile a fine mese</div><div class="big'+(sd<0?' bad':'')+'">'+dh(sd)+'</div><div class="g" style="margin-top:18px"><div><b class="ok">+ '+amt(r)+'</b><span>ricavi DH</span></div><div><b>− '+amt(c)+'</b><span>costi DH</span></div></div>'+(ui.form?'':'<button class="btn" id="nm">+ Movimento</button>')+'</div>';
 if(ui.form)h+=formMov();
 h+='<div class="card"><h2>Movimenti ('+its.length+')</h2>';if(!its.length)h+='<div class="mu">Nessun movimento in questo mese.</div>';
 its.forEach(function(x){var ex=[supName(x),x.ca,x.kw!==''&&x.kw!=null?x.kw+' kWh':'',x.li!==''&&x.li!=null?x.li+' L':'',x.q!==''&&x.q!=null?'q.tà '+x.q:'',x.n].filter(Boolean).join(' · ');
  h+='<div class="row tap" data-em="'+x.id+'"><div class="l"><div>'+esc(x.ds)+'</div><div class="mu">'+dm(x.d)+(ex?' · '+esc(ex):'')+'</div></div><div class="r '+(x.t==='r'?'ok':'')+'">'+(x.t==='r'?'+ ':'− ')+amt(x.am)+'</div></div>'});
 $('#v-mov').innerHTML=h+'</div>';if(ui.form)fillMov()}

/* ---- RIEPILOGO ---- */
function grp(its,t){var g={};its.filter(function(x){return x.t===t}).forEach(function(x){var k=x.ds.trim().toLowerCase();g[k]=g[k]||{n:x.ds.trim(),v:0,c:0};g[k].v+=x.am;g[k].c++});return Object.keys(g).map(function(k){return g[k]}).sort(function(a,b){return b.v-a.v})}
function bars(a){if(!a.length)return '<div class="mu">Nessun dato.</div>';var mx=a[0].v,h='';a.slice(0,8).forEach(function(o){h+='<div style="margin-bottom:12px"><div class="row" style="border:0;padding:0"><span>'+esc(o.n)+(o.c>1?' <span class="mu">×'+o.c+'</span>':'')+'</span><span>'+amt(o.v)+' DH</span></div><div class="bar"><i style="width:'+(o.v/mx*100)+'%"></i></div></div>'});return h}
function renderRie(){var yr=cur.slice(0,4),its=db.m.filter(function(x){return x.d.indexOf(yr)===0}),h='<div class="nav"><button class="ib" data-y="-1">‹</button><b>Anno '+yr+'</b><button class="ib" data-y="1">›</button></div>';
 var c=sum(its,'c'),r=sum(its,'r');
 h+='<div class="card"><div class="mu">Risultato dell\'anno (ricavi − costi)</div><div class="big'+(r-c<0?' bad':'')+'">'+(r-c>=0?'+ ':'')+dh(r-c)+'</div><div class="g" style="margin-top:18px"><div><b class="ok">'+amt(r)+'</b><span>ricavi DH</span></div><div><b>'+amt(c)+'</b><span>costi DH</span></div></div></div>';
 var rows='';for(var q=0;q<4;q++){var a=its.filter(function(x){return Math.ceil(+x.d.slice(5,7)/3)===q+1}),qc=sum(a,'c'),qr=sum(a,'r');if(!a.length)continue;rows+='<div class="row" style="align-items:flex-start"><div class="l"><div>'+TRIM[q]+'</div><div class="mu">'+a.length+' movimenti · costi '+amt(qc)+' · ricavi '+amt(qr)+'</div></div><div class="r '+(qr-qc<0?'bad':'ok')+'">'+(qr-qc>=0?'+ ':'')+dh(qr-qc)+'</div></div>'}
 h+='<div class="card"><h2>Per trimestre</h2>'+(rows||'<div class="mu">Nessun dato.</div>')+'</div>';
 h+='<div class="card"><h2>Costi per voce</h2>'+bars(grp(its,'c'))+'</div><div class="card"><h2>Ricavi per voce</h2>'+bars(grp(its,'r'))+'</div>';
 var el=its.filter(function(x){return x.kw!==''&&x.kw!=null&&x.kw>0}),kw=el.reduce(function(s,x){return s+x.kw},0),ec=el.reduce(function(s,x){return s+x.am},0);
 var ga=its.filter(function(x){return /gasolio/i.test(x.ds)&&x.t==='c'}),gc=ga.reduce(function(s,x){return s+x.am},0),gl=ga.reduce(function(s,x){return s+(+x.li||0)},0);
 h+='<div class="card"><h2>Consumi</h2><div class="g"><div><b>'+nf(kw,0)+'</b><span>kWh registrati</span></div><div><b>'+(kw>0?nf(ec/kw,2):'–')+'</b><span>DH per kWh</span></div><div><b>'+amt(gc)+'</b><span>DH gasolio ('+ga.length+' rifornimenti)</span></div><div><b>'+(gl>0?nf(gl,0):'–')+'</b><span>litri registrati</span></div></div></div>';
 var ix=h.indexOf('</div>')+6;$('#v-rie').innerHTML=h.slice(0,ix)+reportCard()+h.slice(ix)}

function reportCard(){var yr=cur.slice(0,4);return '<div class="card"><h2>Report PDF</h2><div class="nav" style="margin:0 0 6px"><button class="ib" data-m="-1">‹</button><b>'+MESI[+cur.slice(5)-1]+' '+yr+'</b><button class="ib" data-m="1">›</button></div><button class="btn s" id="pm" style="margin-top:6px">PDF mensile</button><button class="btn s" id="py">PDF annuale '+yr+'</button></div>'}

/* ---- PDF ---- */
function pe(s){var o='';for(var k=0;k<s.length;k++){var ch=s[k],c=s.charCodeAt(k);o+=ch==='€'?'\\200':(ch==='\\'||ch==='('||ch===')')?'\\'+ch:(c>=32&&c<256)?ch:'?'}return o}
function pw(s,z){var w=0;for(var k=0;k<s.length;k++){var c=s[k];w+=/\d|€/.test(c)?.556:/[.,: |]/.test(c)?.278:c==='-'?.333:/[A-Z]/.test(c)?.68:.52}return w*z}
function pcl(s){return String(s==null?'':s).replace(/[–—]/g,'-').replace(/→/g,'>')}
function pcut(s,max,z){s=pcl(s);if(pw(s,z)<=max)return s;while(s.length>1&&pw(s+'.',z)>max)s=s.slice(0,-1);return s+'.'}
function makeReport(kind,key){
 var W=595,H=842,M=40,R=W-M,pages=[],cs,y,tbl=false,start=kind==='y'?key+'-01-01':key+'-01',endp=kind==='y'?key+'-12-31':key+'-31',
  its=db.m.filter(function(x){return x.d>=start&&x.d<=endp}).sort(function(a,b){return a.d.localeCompare(b.d)||a.id-b.id}),
  c=sum(its,'c'),r=sum(its,'r'),s0=saldoBefore(start),s1=s0+r-c;
 function np(){cs=[];pages.push(cs);y=H-48}
 function T(t,x,z,b,rg){t=pcl(t);var xx=rg?x-pw(t,z):x;cs.push('BT /F'+(b?2:1)+' '+z+' Tf '+xx.toFixed(1)+' '+y.toFixed(1)+' Td ('+pe(t)+') Tj ET')}
 function TG(t,x,z){cs.push('0.45 g');T(t,x,z,0);cs.push('0 g')}
 function L(){cs.push('0.82 G 0.5 w '+M+' '+(y-3).toFixed(1)+' m '+R+' '+(y-3).toFixed(1)+' l S 0 G')}
 function hdr(){T('Data',M,8,1);T('Voce',92,8,1);T('Dettaglio',225,8,1);T('Costo',495,8,1,1);T('Ricavo',R,8,1,1);L();y-=13}
 function need(h){if(y<M+h){np();if(tbl)hdr()}}
 function sec(t){need(70);y-=10;T(t,M,12,1);y-=18}
 np();
 T(kind==='y'?'Bilancio annuale '+key:'Bilancio di '+MESI[+key.slice(5)-1]+' '+key.slice(0,4),M,18,1);y-=16;TG('Generato il '+dmy(today())+' · importi in DH',M,9);y-=32;
 [['Saldo iniziale',s0],['Ricavi',r],['Costi',c],['Risultato',r-c],['Saldo finale',s1]].forEach(function(q,i){var cx=M+(i%3)*175;if(i===3)y-=40;TG(q[0],cx,8);y-=13;T(sg(q[1])+' DH',cx,13,1);y+=13});y-=44;
 if(kind==='y'){sec('Mese per mese');T('Mese',M,8,1);T('Ricavi',250,8,1,1);T('Costi',340,8,1,1);T('Risultato',430,8,1,1);T('Saldo a fine mese',R,8,1,1);L();y-=13;
  for(var m=1;m<=12;m++){var k=key+'-'+pad(m),a=its.filter(function(x){return x.d.indexOf(k)===0});if(!a.length)continue;need(18);var rr=sum(a,'r'),cc=sum(a,'c');T(MESI[m-1],M,9,0);T(amt(rr),250,9,0,1);T(amt(cc),340,9,0,1);T(sg(rr-cc),430,9,0,1);T(sg(saldo(k+'-31')),R,9,0,1);y-=14}
  sec('Per trimestre');T('Trimestre',M,8,1);T('Ricavi',250,8,1,1);T('Costi',340,8,1,1);T('Risultato',430,8,1,1);L();y-=13;
  for(var q=0;q<4;q++){var a2=its.filter(function(x){return Math.ceil(+x.d.slice(5,7)/3)===q+1});if(!a2.length)continue;need(18);var qr=sum(a2,'r'),qc=sum(a2,'c');T(TRIM[q],M,9,0);T(amt(qr),250,9,0,1);T(amt(qc),340,9,0,1);T(sg(qr-qc),430,9,0,1);y-=14}}
 function voci(t,title){var g=grp(its,t),tot=g.reduce(function(s,o){return s+o.v},0);if(!g.length)return;sec(title);
  g.forEach(function(o){need(18);T(pcut(o.n,170,9),M,9,0);cs.push('0.8 0.88 1 rg 220 '+(y-1.5)+' '+(o.v/g[0].v*110).toFixed(1)+' 7 re f 0 g');T('x'+o.c,352,8,0);T(Math.round(o.v/tot*100)+'%',425,8,0,1);T(amt(o.v),R,9,0,1);y-=14});
  need(16);L();y-=4;T('Totale',M,9,1);T(amt(tot),R,9,1,1);y-=12}
 voci('c','Costi per voce');voci('r','Ricavi per voce');
 if(db.f.length){sec('Fornitori e spese');T('Fornitore',M,8,1);T('Telefono',300,8,1);T('Speso nel periodo',R,8,1,1);L();y-=13;
  db.f.slice().sort(function(a,b){return supLabel(a).localeCompare(supLabel(b))}).forEach(function(f){need(18);var sp=its.filter(function(x){return x.t==='c'&&x.fo===f.id}).reduce(function(s,x){return s+x.am},0);T(pcut(supLabel(f),250,9),M,9,0);T(f.tel||'',300,9,0);T(amt(sp)+' DH',R,9,0,1);y-=14})}
 var el=its.filter(function(x){return x.kw!==''&&x.kw!=null&&x.kw>0}),kw=el.reduce(function(s,x){return s+x.kw},0),ec=el.reduce(function(s,x){return s+x.am},0),
  ga=its.filter(function(x){return /gasolio/i.test(x.ds)&&x.t==='c'}),gc=ga.reduce(function(s,x){return s+x.am},0),gl=ga.reduce(function(s,x){return s+(+x.li||0)},0);
 if(kw>0||gc>0){sec('Consumi');if(kw>0){T('Elettricità: '+nf(kw,0)+' kWh · costo '+amt(ec)+' DH · '+nf(ec/kw,2)+' DH per kWh',M,9,0);y-=14}
  if(gc>0){T('Gasolio: '+amt(gc)+' DH · '+ga.length+' rifornimenti'+(gl>0?' · '+nf(gl,0)+' litri registrati':''),M,9,0);y-=14}}

function dl(name,type,bytes){
 var blob=new Blob([bytes],{type:type});
 try{var f=new File([blob],name,{type:type});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}}catch(e){}

 setTimeout(function(){URL.revokeObjectURL(u)},60000);toast('File pronto: controlla i Download');
}
